name: Publish shuffle in v0.1.2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-v012-shuffle.yml']

permissions:
  contents: read

concurrency:
  group: refresh-v012-shuffle
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-shuffle-v012]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check existing packaging tools
        run: |
          python3 --version
          7z i
          gh --version
      - name: Build with 7-Zip, verify and promote while retaining old assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/refresh_v012_shuffle.py --publish --output "$RUNNER_TEMP/shuffle-release"
      - name: Preserve package verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.1.2-shuffle-verification
          path: |
            ${{ runner.temp }}/shuffle-release/verification.json
            ${{ runner.temp }}/shuffle-release/publication.json
          if-no-files-found: ignore
